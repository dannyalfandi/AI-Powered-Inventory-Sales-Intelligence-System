# Lint and test every service of the monorepo, one job per service, in parallel.
# On a pull request a job only runs when its folder changed (or this file did);
# a skipped job still reports success, so it can be a required status check.
# On a push to master every job runs, so the badge reflects the whole repo.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      backend: ${{ steps.filter.outputs.backend }}
      ml: ${{ steps.filter.outputs.ml }}
      mobile: ${{ steps.filter.outputs.mobile }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 'every': a file counts only if it matches all patterns of a filter,
          # so the '!**/*.md' lines keep README edits from running the tests.
          predicate-quantifier: every
          filters: |
            ci:
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '!**/*.md'
            ml:
              - 'ml-service/**'
              - '!**/*.md'
            mobile:
              - 'mobile/**'
              - '!**/*.md'
            infra:
              - 'infra/**'
              - '!**/*.md'

  backend:
    name: backend
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Only for the repository integration tests; no test needs Redis.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d inventory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Read by the *_integration_test.go files in internal/repository; when it
      # is unset those tests skip, which the summary step below refuses.
      TEST_DATABASE_URL: postgres://ci:ci-only-not-a-secret@localhost:5432/inventory_test?sslmode=disable
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      # The analytics and role tests run inside a rolled-back transaction on the
      # existing tables, so the schema must exist first.
      - name: Migrate the test database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          REDIS_ADDR: localhost:6379 # required by config.Load; migrate never dials it
        run: go run ./cmd/migrate

      - name: go test
        run: go test ./... -count=1 -v 2>&1 | tee "$RUNNER_TEMP/go-test.log"

      - name: Test summary (no skipped tests allowed)
        run: |
          passed=$(grep -cE '^\s*--- PASS:' "$RUNNER_TEMP/go-test.log" || true)
          failed=$(grep -cE '^\s*--- FAIL:' "$RUNNER_TEMP/go-test.log" || true)
          skipped=$(grep -cE '^\s*--- SKIP:' "$RUNNER_TEMP/go-test.log" || true)
          echo "passed=$passed failed=$failed skipped=$skipped"
          {
            echo "### Go tests"
            echo "| passed | failed | skipped |"
            echo "|---|---|---|"
            echo "| $passed | $failed | $skipped |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped test(s) skipped; the SQL integration tests must run in CI"
            grep -E '^\s*--- SKIP:' "$RUNNER_TEMP/go-test.log"
            exit 1
          fi

  ml-service:
    name: ml-service
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15" # same as ml-service/Dockerfile
          cache: pip
          cache-dependency-path: |
            ml-service/requirements.txt
            ml-service/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -ra

  mobile:
    name: mobile
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # pubspec.yaml pins only the Dart SDK (no environment.flutter), so the
      # version is set here: the one the app is developed and tested with.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true
      - name: flutter pub get
        run: flutter pub get
      # No build_runner: *.g.dart, *.freezed.dart and the l10n output are
      # committed. `flutter pub get` regenerates l10n (generate: true).
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test

  docker-config:
    name: docker-config
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: infra
    # Dummy values, only so compose can interpolate the file. Nothing starts.
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-dummy
      POSTGRES_DB: ci
      REDIS_PASSWORD: ci-dummy
      JWT_SECRET: ci-dummy-value-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - name: compose config (default)
        run: docker compose config -q
      - name: compose config (profile app)
        run: docker compose --profile app config -q
      - name: compose config (profile seed)
        run: docker compose --profile seed config -q
