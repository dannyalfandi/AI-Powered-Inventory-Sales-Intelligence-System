# End-to-end: the whole stack from infra/docker-compose.yml (profile app), seeded,
# then backend/scripts/e2e.sh against it. Heavier than CI, so it runs on pushes
# to master and on demand, not on every pull request.
name: E2E

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: infra
    env:
      COMPOSE_PROJECT_NAME: inventory-ci
      POSTGRES_USER: ci
      POSTGRES_DB: inventory_ci
    steps:
      - uses: actions/checkout@v4

      # Fresh random values for this run only: never a real secret, never
      # stored. Hex keeps them URL-safe for the DATABASE_URL compose builds.
      - name: Generate throwaway credentials
        run: |
          for name in POSTGRES_PASSWORD REDIS_PASSWORD JWT_SECRET; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Build and start the stack (profile app)
        run: docker compose --profile app up -d --build --wait --wait-timeout 300

      - name: Seed demo data
        run: docker compose --profile seed run --rm seed

      # E2E_SKIP_CLEANUP: the script's own cleanup runs `go run ./cmd/seed`
      # with backend/.env, which doesn't exist here; `down -v` below drops
      # everything anyway.
      - name: Run backend/scripts/e2e.sh
        working-directory: backend
        env:
          API_URL: http://localhost:8080/api/v1
          ML_SERVICE_URL: http://localhost:8000
          E2E_SKIP_CLEANUP: "1"
        run: bash scripts/e2e.sh

      - name: Collect compose logs
        if: failure()
        run: |
          docker compose --profile app --profile seed ps -a > "$RUNNER_TEMP/compose-ps.txt" 2>&1 || true
          docker compose --profile app --profile seed logs --no-color --timestamps > "$RUNNER_TEMP/compose-logs.txt" 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-compose-logs
          path: |
            ${{ runner.temp }}/compose-ps.txt
            ${{ runner.temp }}/compose-logs.txt
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose --profile app --profile seed down -v --remove-orphans
